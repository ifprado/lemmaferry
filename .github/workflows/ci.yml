name: Reproduce starter checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - name: Run Python tests and both alignment seeds
        run: |
          mkdir -p results/ci-python
          python --version 2>&1 | tee results/ci-python/python-version.txt
          python -m pip freeze > results/ci-python/environment.txt
          python -m unittest discover -s tests -v 2>&1 | tee results/ci-python/tests.log
          python experiments/toy_alignment.py --seed 7 --output results/ci-python/alignment-seed7.json
          python experiments/toy_alignment.py --seed 19 --output results/ci-python/alignment-seed19.json
      - run: python experiments/generate_logic.py --count 5 --seed 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: python-check-results-${{ matrix.python-version }}
          path: results/ci-python/
          if-no-files-found: error

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Generate 20 examples per split
        run: |
          mkdir -p results/ci-lean
          python experiments/generate_logic.py --count 20 --seed 7 | tee results/ci-lean/generation.log
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6 # v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Check all generated splits and axiom audits
        working-directory: lean
        run: |
          lean --version | tee ../results/ci-lean/lean-version.txt
          elan --version | tee ../results/ci-lean/elan-version.txt
          python ../experiments/check_lean.py ../data/generated/train.jsonl --output ../results/ci-lean/train.checked.jsonl --log-dir ../results/ci-lean/logs/train | tee ../results/ci-lean/train-check.log
          python ../experiments/check_lean.py ../data/generated/validation.jsonl --output ../results/ci-lean/validation.checked.jsonl --log-dir ../results/ci-lean/logs/validation | tee ../results/ci-lean/validation-check.log
          python ../experiments/check_lean.py ../data/generated/test.jsonl --output ../results/ci-lean/test.checked.jsonl --log-dir ../results/ci-lean/logs/test | tee ../results/ci-lean/test-check.log
      - name: Assert complete evidence and hash inputs, outputs, logs, and sources
        run: python experiments/verify_lean_evidence.py --count 20
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lean-check-results
          path: |
            results/ci-lean/
            data/generated/
            lean/lean-toolchain
            lean/lake-manifest.json
          if-no-files-found: error
